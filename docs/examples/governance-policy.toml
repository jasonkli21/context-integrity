# Template: copy to the checkout root as governance.toml, then review/commit it.
# Relative roots resolve against this policy file, so this template is not run in place.
governance_schema_version = 2
policy_id = "repository-pr"
owner = "team:maintainers"
fail_on = "medium"
on_inconclusive = "fail"

[[targets]]
id = "app"
kind = "repository"
root = "."
require_architecture = false

# This starter profile covers this repository target's configured checks only. With no declared
# architecture invariants, require_architecture=false does not require architecture coverage;
# this is not a complete architecture/workspace/derived compliance profile.
# Add explicit workspace/derived targets only when their inputs exist and are in scope.
# For protected CI, declare and protect every required check family before enabling this policy.
# V2 waivers must record the reviewed finding severity, owner, and fail_on threshold.
# [[waivers]]
# id = "REVIEWED-EXCEPTION-1"
# target = "app"
# finding_fingerprint = "<64 lowercase hex characters from a report>"
# owner = "team:maintainers"
# reason = "Temporary exception with a specific remediation plan"
